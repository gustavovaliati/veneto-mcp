[project]
name = "veneto-mcp"
version = "0.1.0"
description = "A remote, OAuth-protected MCP endpoint for a FastAPI app: sign in upstream once, the app decides who gets in."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # Pinned: the sign-in proxy overrides two of OAuthProxy's documented hooks
    # (`_create_upstream_oauth_client`, `_handle_idp_callback`); bump deliberately, with the tests.
    "fastmcp==4.1.3",
    "sqlalchemy[asyncio]>=2.0",
    "cryptography",
]

[project.optional-dependencies]
#: `veneto_mcp.testing` (the fake provider and the scripted sign-in) drives the app over httpx.
testing = ["httpx"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "aiosqlite",
    "fastapi",
    "httpx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/veneto_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]
#: The README example is kept compact on purpose.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
