[project]
name = "veneto-mcp"
version = "0.1.1"
description = "A remote, OAuth-protected MCP endpoint for a FastAPI app: sign in upstream once, the app decides who gets in."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    # Pinned: the sign-in proxy (proxy.py) leans on OAuthProxy internals: it overrides
    # `_create_upstream_oauth_client` (a documented override point), `_handle_idp_callback` and
    # `_prepare_scopes_for_token_exchange`, reads `_upstream_client_id`,
    # `_token_endpoint_auth_method` and `_transaction_store`, and sets the upstream client's
    # `_client`; storage.py imports `key_value.aio._utils.managed_entry`. Bump deliberately: the
    # tests drive the real flow end to end, so a changed internal fails them.
    "fastmcp==4.1.3",
    "sqlalchemy[asyncio]>=2.0",
    "cryptography",
]

[project.optional-dependencies]
#: `veneto_mcp.testing` (the fake provider and the scripted sign-in) drives the app over httpx.
testing = ["httpx"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "aiosqlite",
    "fastapi",
    "httpx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/veneto_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]
#: The README example is kept compact on purpose.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
